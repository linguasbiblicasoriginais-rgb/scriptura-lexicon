name: Frontend — navegação e catálogo em Chromium

on:
  push:
    branches: [chat-gpt-frontend, chat-gpt-performance, chat-gpt-jastrow, chat-gpt-bdbh, chat-gpt-klein, chat-gpt-bdba]
    paths:
      - 'index.html'
      - 'script.js'
      - 'lexicons/on-demand-search.js'
      - 'lexicons/dgp-format.js'
      - 'lexicon-modules.json'
      - 'scripts/build-on-demand.mjs'
      - 'netlify.toml'
      - 'style.css'
      - 'lexicons/source-catalog.js'
      - 'tests/frontend-reader-browser.mjs'
      - '.github/workflows/frontend-reader.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  frontend-browser:
    runs-on: ubuntu-latest
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Gerar índice invertido e cartões sob demanda
        run: node --max-old-space-size=4096 scripts/build-on-demand.mjs
      - name: Instalar Playwright e Chromium
        run: |
          npm install --no-save --package-lock=false playwright@1.56.1
          npx playwright install --with-deps chromium
      - name: Iniciar servidor estático
        run: |
          python3 -m http.server 8765 --bind 127.0.0.1 >/tmp/scriptura-frontend.log 2>&1 &
          sleep 2
      - name: Conferir pesquisa, fonte, leitura e retorno em todos os dicionários
        run: node tests/frontend-reader-browser.mjs
      - name: Diagnóstico do servidor em falhas
        if: failure()
        run: cat /tmp/scriptura-frontend.log || true
