name: UXLC — inspecionar XML e registrar estrutura
on:
  push:
    branches: [chat-gpt-escrituras]
    paths:
      - '.github/workflows/uxlc-inspect.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Baixar fonte fixada e conferir SHA-256
        run: |
          set -euo pipefail
          curl --fail --location --silent --show-error --retry 3 \
            'https://www.tanach.us/Books/Tanach.xml.zip' -o /tmp/Tanach.xml.zip
          echo '423469bdcc4bfe36d7666f8e76fbd02c1674d77469093c06cee9779c0fba83e3  /tmp/Tanach.xml.zip' | sha256sum -c -
      - name: Inspecionar estrutura sem publicar conteúdo
        run: |
          python3 - <<'PY'
          import zipfile,xml.etree.ElementTree as E,collections,json
          with zipfile.ZipFile('/tmp/Tanach.xml.zip') as z:
              names=z.namelist()
              info={"zipFiles":names,"examples":{}}
              for book in ["Genesis.xml","Habakkuk.xml","Chronicles 2.xml"]:
                  found=[x for x in names if x.endswith("/"+book) or x==book]
                  assert len(found)==1, (book,found)
                  root=E.fromstring(z.read(found[0]))
                  t=lambda x:x.tag.rsplit("}",1)[-1]
                  chapters=[x for x in root.iter() if t(x)=="c"]
                  verses=[x for x in root.iter() if t(x)=="v"]
                  v=verses[0] if verses else None
                  info["examples"][book]={
                      "rootTag":t(root),"rootChildren":[[t(x),x.attrib] for x in list(root)[:6]],
                      "tags":dict(collections.Counter(t(x) for x in root.iter())),
                      "chapters":len(chapters),"chapterFirst":[x.attrib for x in chapters[:3]],
                      "verseFirst":[x.attrib for x in verses[:5]],
                      "verseChildKinds":[[t(x),x.attrib] for x in list(v)[:15]] if v is not None else [],
                      "verseTextLen":len("".join(v.itertext())) if v is not None else 0,
                  }
              with open("scriptures/uxlc-inspection.json","w",encoding="utf8") as f:
                  json.dump(info,f,ensure_ascii=False,indent=2)
          PY
      - name: Registrar resultado da inspeção na branch de trabalho
        run: |
          set -euo pipefail
          git config user.name 'Scriptura Lexicon UXLC'
          git config user.email 'uxlc-import@users.noreply.github.com'
          git add scriptures/uxlc-inspection.json
          git commit -m 'Escrituras UXLC: registrar estrutura XML comprovada'
          git push origin HEAD:chat-gpt-escrituras
