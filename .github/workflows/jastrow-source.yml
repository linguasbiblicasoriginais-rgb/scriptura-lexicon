name: JASTROW - extrair lote canônico (somente fonte)
on:
  push:
    branches: [chat-gpt-jastrow]
    paths:
      - ".github/workflows/jastrow-source.yml"
      - "tools/jastrow_source.py"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: jastrow-source-chat-gpt-jastrow
  cancel-in-progress: false

jobs:
  extrair-fonte:
    name: Extrair 200 entradas originais sem traduzir/publicar
    runs-on: ubuntu-latest
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v4
        with:
          ref: chat-gpt-jastrow
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Validar sintaxe do extrator
        run: python -m py_compile tools/jastrow_source.py
      - name: Não sobrescrever um lote já recuperado
        id: guard
        shell: bash
        run: |
          if test -e lexicons/jastrow-source-lote-0001.json; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
            echo "Lote-fonte já existe; nenhuma extração duplicada."
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi
      - name: Recuperar registros completos da Sefaria
        if: steps.guard.outputs.exists == 'false'
        run: |
          python tools/jastrow_source.py \
            --limit 200 \
            --delay 0.35 \
            --output lexicons/jastrow-source-lote-0001.json
      - name: Conferir cardinalidade, unicidade e cadeia lexical
        if: steps.guard.outputs.exists == 'false'
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          d=json.loads(Path('lexicons/jastrow-source-lote-0001.json').read_text(encoding='utf-8'))
          rs=d['records']
          assert d['status']=='source_only_untranslated_not_published'
          assert len(rs)==d['entry_count']==200
          assert all(r['source']['parent_lexicon']=='Jastrow Dictionary' for r in rs)
          assert len({r['source']['rid'] for r in rs}) == 200
          assert len({r['source']['headword'] for r in rs}) == 200
          for x, y in zip(rs, rs[1:]):
              assert x['source']['next_hw']==y['source']['headword']
          print('VALIDACAO FONTE: 200 registros, 200 IDs, 200 lemas, cadeia consistente')
          PY
      - name: Commit da fonte íntegra na mesma branch, sem contar como verbetes publicados
        if: steps.guard.outputs.exists == 'false'
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- lexicons/jastrow-source-lote-0001.json
          git commit -m "JASTROW: armazenar 200 registros da fonte para tradução e auditoria"
          git push origin HEAD:chat-gpt-jastrow
