name: JASTROW - extrair lote-fonte canônico (XML Sefaria-Data)

on:
  push:
    branches: [chat-gpt-jastrow]
    paths:
      - ".github/workflows/jastrow-source.yml"
      - "tools/jastrow_source.py"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: jastrow-source-chat-gpt-jastrow
  cancel-in-progress: false

jobs:
  extrair-fonte:
    name: Recuperar 200 verbetes originais (não traduzidos)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: chat-gpt-jastrow
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Validar sintaxe Python
        run: python -m py_compile tools/jastrow_source.py
      - name: Verificar se o lote-fonte já foi gravado
        id: guard
        shell: bash
        run: |
          if test -e lexicons/jastrow-source-lote-0004.json; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
            echo "Nenhuma duplicação: arquivo-fonte já existe."
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi
      - name: Extrair XML canônico, fonte fixa Sefaria-Data
        if: steps.guard.outputs.exists == 'false'
        run: |
          python tools/jastrow_source.py --start-ordinal 600 --limit 200 \
            --output lexicons/jastrow-source-lote-0004.json
      - name: Publicar SOMENTE camada Fonte na branch exclusiva
        if: steps.guard.outputs.exists == 'false'
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- lexicons/jastrow-source-lote-0004.json
          git commit -m "JASTROW: preservar lote 4, ordinais 601-800, da fonte XML Sefaria-Data"
          git push origin HEAD:chat-gpt-jastrow
