name: JASTROW - auditoria cumulativa dos 510 registros

on:
  push:
    branches: [chat-gpt-jastrow]
    paths:
      - ".github/workflows/jastrow-audit-510.yml"
      - "tools/audit_jastrow_510.js"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validar-jastrow:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: chat-gpt-jastrow
          fetch-depth: 0
      - name: Auditar JavaScript, XML, busca, cartões e popups
        run: node tools/audit_jastrow_510.js
