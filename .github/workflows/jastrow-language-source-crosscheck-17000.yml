name: JASTROW - cruzar glosas com XML original 17000
on:
  push:
    branches: [chat-gpt-jastrow]
    paths: [".github/workflows/jastrow-language-source-crosscheck-17000.yml"]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  leitura:
    runs-on: ubuntu-latest
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v4
        with:
          ref: chat-gpt-jastrow
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Instalar detector de idioma
        run: python -m pip install lingua-language-detector==2.1.1
      - name: Cruzar todas as glosas com textos ingleses da fonte XML
        run: python tools/jastrow_language_source_crosscheck_17000.py
