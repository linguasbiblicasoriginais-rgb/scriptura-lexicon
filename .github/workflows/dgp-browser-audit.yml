name: DGP — cotejo estatico e popups no navegador
on:
  push:
    branches: [chat-gpt-correcoes]
    paths:
      - 'lexicons/dgp-format.js'
      - 'lexicons/dgp-format.css'
      - 'auditorias/dgp-2026-10-14-cotejo-0001-1000.json'
      - 'tests/test_dgp_cotejo_1000.js'
      - 'tests/test_dgp_citation_browser_1000.py'
      - '.github/workflows/dgp-browser-audit.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  validar-dgp:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Cotejo DGP 1-1000 e compilacao do formatador
        run: node tests/test_dgp_cotejo_1000.js
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Instalar Chromium headless e Playwright
        run: |
          python -m pip install 'playwright>=1.55,<2'
          python -m playwright install --with-deps chromium
      - name: Citações 14 e 17 com transliteração e popup gramatical
        run: python tests/test_dgp_citation_browser_1000.py
# O teste historico tests/test_dgp_browser.py de montagem 2880->3300
# pressupunha que dgp-batch-077.js ainda nao existia; ele permanece
# arquivado, mas nao pode mais servir de gate desta nova revisao.
