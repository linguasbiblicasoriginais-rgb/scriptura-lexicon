name: DGP etapa 3 — dez candidatos 41–58
on:
  push:
    branches: [chat-gpt-correcoes, chat-gpt-commits]
    paths:
      - '.github/workflows/dgp-stage3-41-58.yml'
      - 'tests/test_dgp_stage3_41_58.py'
      - 'auditorias/dgp-etapa3-candidatos-41-58.json'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  validar-dez:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Compilar índice de busca (mesmo build do Netlify)
        run: node --max-old-space-size=4096 scripts/build-on-demand.mjs
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Instalar Playwright Chromium
        run: |
          python -m pip install 'playwright>=1.55,<2'
          python -m playwright install --with-deps chromium
      - name: Testar individualmente dez artigos DGP
        run: python tests/test_dgp_stage3_41_58.py
