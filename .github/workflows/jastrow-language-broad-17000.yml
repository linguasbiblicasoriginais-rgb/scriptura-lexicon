name: JASTROW - buscas amplas por ingles remanescente
on:
  push:
    branches: [chat-gpt-jastrow]
    paths: [".github/workflows/jastrow-language-broad-17000.yml"]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  leitura:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          ref: chat-gpt-jastrow
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Instalar detectores
        run: python -m pip install lingua-language-detector==2.1.1 wordfreq==3.1.1
      - name: Identificar vocabulos ingleses em glosas com filtro ampliado
        run: python tools/jastrow_english_token_broad_17000.py
