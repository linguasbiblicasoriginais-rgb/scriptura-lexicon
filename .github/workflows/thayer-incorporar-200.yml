name: THAYER — incorporacao exclusiva de 200 verbetes
on:
  push:
    branches:
      - chat-gpt-thayer
    paths:
      - .github/workflows/thayer-incorporar-200.yml

permissions:
  contents: write

concurrency:
  group: thayer-incorporacao-200
  cancel-in-progress: false

jobs:
  incorporar:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          ref: chat-gpt-thayer
          persist-credentials: true
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Preparar traducao local, sem API remunerada
        run: python -m pip install --quiet argostranslate
      - name: Incorporar 200 verbetes THAYER G492–G691
        run: python tools/thayer_incorporar_200.py
