name: DGP Etapa 3 — casos individuais
on:
  push:
    branches: [chat-gpt-correcoes]
    paths:
      - '.github/workflows/dgp-stage3-15.yml'
      - 'tests/test_dgp_stage3_15.py'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  quinze-casos:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Instalar navegador
        run: |
          python -m pip install 'playwright>=1.55,<2'
          python -m playwright install --with-deps chromium
      - name: Auditar quinze artigos individualmente no navegador
        run: python tests/test_dgp_stage3_15.py
