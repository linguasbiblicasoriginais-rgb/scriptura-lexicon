name: DGP Etapa 3 — casos individuais
on:
  push:
    branches: [chat-gpt-correcoes, chat-gpt-commits]
    paths:
      - '.github/workflows/dgp-stage3-15.yml'
      - 'tests/test_dgp_stage3_15.py'
      - 'auditorias/dgp-etapa3-quinze-candidatos.json'
      - 'auditorias/dgp-etapa3-0001-1000.json'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  quinze-casos:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Construir catálogo sob demanda no destino consolidado
        if: github.ref_name == 'chat-gpt-commits'
        run: node --max-old-space-size=4096 scripts/build-on-demand.mjs
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Instalar navegador
        run: |
          python -m pip install 'playwright>=1.55,<2'
          python -m playwright install --with-deps chromium
      - name: Auditar quinze artigos individualmente no navegador
        run: python tests/test_dgp_stage3_15.py
