name: Fílon — obras integrais e catálogo editorial
on:
  pull_request:
    branches: [chat-gpt-commits]
    paths:
      - 'filon/**'
      - 'scriptures/greek-authors.js'
      - 'scriptures/sections.js'
      - 'tests/filon-external-catalog-browser.mjs'
      - 'tests/filon-de-abrahamo-browser.mjs'
      - 'tests/filon-de-aeternitate-browser.mjs'
      - 'tests/filon-de-agricultura-browser.mjs'
      - 'tests/filon-de-cherubim-browser.mjs'
      - 'tests/filon-de-confusione-browser.mjs'
      - 'tests/filon-de-congressu-browser.mjs'
      - 'index.html'
      - '.github/workflows/filon-catalog.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  philo-catalog:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verificar sintaxe dos arquivos modificados
        run: |
          node --check filon/reader.js
          node --check filon/aeternitate-reader.js
          node --check filon/agricultura-reader.js
          node --check filon/cherubim-reader.js
          node --check filon/confusione-reader.js
          node --check filon/congressu-reader.js
          node --check scriptures/greek-authors.js
          node --check scriptures/sections.js
          node --check tests/filon-external-catalog-browser.mjs
          node --check tests/filon-de-abrahamo-browser.mjs
          node --check tests/filon-de-aeternitate-browser.mjs
          node --check tests/filon-de-agricultura-browser.mjs
          node --check tests/filon-de-cherubim-browser.mjs
          node --check tests/filon-de-confusione-browser.mjs
          node --check tests/filon-de-congressu-browser.mjs
      - name: Instalar Chromium
        run: |
          npm install --no-save --package-lock=false playwright@1.56.1
          npx playwright install --with-deps chromium
      - name: Iniciar aplicação
        run: |
          python3 -m http.server 8765 --bind 127.0.0.1 >/tmp/filon-http.log 2>&1 &
          sleep 2
      - name: Validar seis obras integrais e demais obras externas
        run: |
          node tests/filon-external-catalog-browser.mjs
          node tests/filon-de-abrahamo-browser.mjs
          node tests/filon-de-aeternitate-browser.mjs
          node tests/filon-de-agricultura-browser.mjs
          node tests/filon-de-cherubim-browser.mjs
          node tests/filon-de-confusione-browser.mjs
          node tests/filon-de-congressu-browser.mjs
      - name: Logs da aplicação
        if: failure()
        run: cat /tmp/filon-http.log || true
