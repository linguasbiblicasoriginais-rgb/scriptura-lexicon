name: SBLGNT — importar texto crítico grego
on:
  push:
    branches: [chat-gpt-melhorias]
    paths: ['scripts/sblgnt_import.py','.github/workflows/sblgnt-import.yml']
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: sblgnt-import-locked
  cancel-in-progress: false
jobs:
  import:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: chat-gpt-melhorias
          fetch-depth: 1
      - name: Baixar edição crítica oficial (SHA/commit fixados)
        run: |
          set -euo pipefail
          curl --fail --location --silent --show-error --retry 3 \
            https://codeload.github.com/Faithlife/SBLGNT/zip/c4d241a9c1c479a55b989ba35a4976c1d0b8052c \
            -o /tmp/sblgnt-official.zip
      - name: Validar fonte, gerar corpus e registrar aparato separado
        run: |
          set -euo pipefail
          python3 scripts/sblgnt_import.py /tmp/sblgnt-official.zip
      - name: Testar os 260 módulos, sinais e independência
        run: |
          set -euo pipefail
          node - <<'NODE'
          const fs=require('node:fs'),vm=require('node:vm'),assert=require('node:assert/strict');
          const m=JSON.parse(fs.readFileSync('scriptures/sblgnt-progress.json','utf8'));
          const a=JSON.parse(fs.readFileSync('scriptures/sblgnt-apparatus.json','utf8'));
          const html=fs.readFileSync('index.html','utf8');
          const reader=fs.readFileSync('scriptures/reader.js','utf8');
          assert.equal(m.totalBooks,27);assert.equal(m.chapters,260);assert.equal(m.verses,7939);
          assert.equal(Object.keys(a).length,27);
          assert.ok(reader.includes('SBL Greek New Testament — Holmes (2010)'));
          assert.ok(reader.includes('ScripturaWordPopups?.attach(panel, textRegion)'));
          assert.ok(reader.includes('Novo Testamento Grego – Texto Crítico (NA28)'));
          assert.ok(reader.includes('Novo Testamento Grego – Texto Crítico (UBS5)'));
          assert.ok(reader.includes('SBLGNT|NA28|UBS5|TR|VUL'));
          const css=fs.readFileSync('scriptures/reader.css','utf8');
          assert.ok(/\.scripture-word\s*\{[^}]*text-decoration:\s*none/.test(css));
          const win={},context=vm.createContext({window:win}),marks={'⸀':0,'⸂':0,'⸃':0};
          let chapters=0,verses=0;
          for(const b of m.books)for(let c=1;c<=b.chapters;c++){
            const path='scriptures/texts/sblgnt-'+b.slug+'-'+c+'.js';
            assert.equal(html.split('src="'+path+'"').length-1,1,path);
            vm.runInContext(fs.readFileSync(path,'utf8'),context,{filename:path});
            const o=win.ScripturaScriptureTexts.SBLGNT[b.id][c];
            assert.equal(Object.keys(o).length,b.perChapter[c-1],path);
            for(const s of Object.values(o)){
              assert.ok(s && !s.includes('\ufffd'),path);
              for(const mark of Object.keys(marks))marks[mark]+=s.split(mark).length-1;
              verses++;
            }
            chapters++;
          }
          assert.equal(verses,m.verses);assert.equal(chapters,m.chapters);
          for(const [mark,count] of Object.entries(m.criticalSigns))assert.equal(marks[mark],count);
          assert.equal(Object.keys(win.ScripturaScriptureTexts).join(','),'SBLGNT');
          assert.equal(m.license,'Creative Commons Attribution 4.0 International (CC BY 4.0)');
          for(const edition of ['uxlc','lxx','vul','tr']){
            assert.ok(html.includes('scriptures/texts/'+edition+'-'),edition+' corpus desapareceu');
          }
          console.log('OK SBLGNT:',m.totalBooks,'livros;',chapters,'capítulos;',verses,'versículos');
          console.log('MARCAÇÕES:',JSON.stringify(marks));
          console.log('APARATO:',m.apparatusVerseUnits,'unidades',m.apparatusNotes,'notas');
          NODE
      - name: Publicar somente após todas as validações
        run: |
          set -euo pipefail
          git config user.name 'Scriptura Lexicon'
          git config user.email 'sblgnt-import@users.noreply.github.com'
          git add index.html scriptures/reader.js scriptures/sblgnt-progress.json \
             scriptures/sblgnt-apparatus.json
          git add -A scriptures/texts
          if git diff --cached --quiet; then echo 'Sem mudanças'; exit 0; fi
          git commit -m 'Escrituras: incorporar SBLGNT crítico (27 livros, 260 capítulos)'
          git push origin HEAD:chat-gpt-melhorias
