name: JASTROW - levantamento aprofundado de glosas 17000
on:
  push:
    branches: [chat-gpt-jastrow]
    paths: [".github/workflows/jastrow-language-deep-17000.yml"]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  conferencia:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          ref: chat-gpt-jastrow
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Instalar detectores
        run: python -m pip install lingua-language-detector==2.1.1 wordfreq==3.1.1
      - name: Examinar todas as 17000 glosas e comparar texto com fonte canônica
        run: python tools/jastrow_language_inventory_deep_17000.py
