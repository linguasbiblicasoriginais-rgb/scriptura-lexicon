name: JASTROW - auditoria cumulativa ate 600
on:
  push:
    branches: [chat-gpt-jastrow]
    paths:
      - ".github/workflows/jastrow-audit-600.yml"
      - "tools/audit_jastrow_600.js"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verificar:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: chat-gpt-jastrow
          fetch-depth: 0
      - name: Verificar 600 IDs, XML, cards, alvos e popups
        run: node tools/audit_jastrow_600.js
